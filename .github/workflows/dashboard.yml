name: Dashboard — refresh the data

# The dashboard carries a live casualty series, so it goes stale on its own.
# This workflow re-pulls the upstream feeds every night, refuses to publish
# anything validate.py reports as broken, and commits only when a figure has
# actually changed.
#
# There is no deploy job here on purpose. Pages serves this repository from the
# main branch (a legacy build, source `main` `/`), so the commit this workflow
# makes is itself the deployment. Adding an Actions deployment would mean
# switching the Pages source and would gain nothing.
#
# build.py and verify.py are not run here either. Both read report-final.md
# from the parent directory, and that markdown lives with the documents rather
# than on the published site. data/report.json changes only when the report
# changes, and it is rebuilt and pushed from there by publish.py.

on:
  schedule:
    # 05:17 UTC daily. The upstream daily file is normally posted before 04:00.
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths:
      # Anything that changes what the static layer should say.
      - 'data/**'
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'prerender.py'
      - 'validate.py'
      - 'fetch_timeseries.py'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: 'Rebuild from the cached raw feeds instead of downloading'
        type: boolean
        default: false

permissions:
  contents: write   # the nightly data commit

# One refresh at a time, and never cancel one half way through.
concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull the live casualty series
        if: ${{ inputs.skip_fetch != true }}
        run: python3 fetch_timeseries.py | tee "$RUNNER_TEMP/fetch.log"

      - name: Rebuild from the cached raw feeds
        if: ${{ inputs.skip_fetch == true }}
        run: python3 fetch_timeseries.py --offline | tee "$RUNNER_TEMP/fetch.log"

      - name: Validate the data
        # validate.py exits non-zero on any failure, which stops the job before
        # the commit, so the previously published data stays live rather than
        # being replaced by something that does not hold together. It checks the
        # data rather than the rendering: figure agreement across files, map
        # joins, chart wiring, source attribution, canonical URLs.
        run: |
          set -o pipefail
          python3 validate.py | tee "$RUNNER_TEMP/validate.log"

      - name: Look for a change worth committing
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No change in the data files.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git status --porcelain -- data/
          fi

      # The static snapshots carry the figures and the generation date, so they
      # are rebuilt whenever the data moved. On a nightly run with no change
      # they are deliberately left alone: regenerating them would restamp the
      # date and produce a commit saying nothing happened. A push or a manual
      # run rebuilds them regardless, because the routes or the copy may be
      # what changed.
      # The share cards are deliberately not rebuilt here. They are text drawn
      # with whichever fonts the machine has, so the runner's copies differ from
      # the ones built on the workstation even when nothing about the site has
      # changed — each would overwrite the other for ever. A card changes only
      # when a route's title or description changes, and that arrives in a push
      # from the workstation, which builds the cards in the same pass.
      - name: Rebuild the static snapshots and sitemap
        id: static
        if: steps.diff.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          set -o pipefail
          CHROME="$(command -v google-chrome || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chrome on the runner; the snapshots cannot be rendered.' >&2
            exit 1
          fi
          python3 prerender.py --chrome "$CHROME" --no-cards | tee "$RUNNER_TEMP/prerender.log"

      # validate.py checks the data and prerender.py writes the snapshots, and
      # neither can tell whether a chart drew. A chart that throws leaves its
      # container empty rather than stopping the page, so this opens every route
      # in the browser and fails the run if a container has no canvas in it, if
      # anything fell back to the failure plate, or if the page logged an error.
      # A run that stops here has published nothing: the commit is the step
      # after this one.
      - name: Render every route
        if: steps.diff.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          set -o pipefail
          CHROME="$(command -v google-chrome || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chrome on the runner; the routes cannot be rendered.' >&2
            exit 1
          fi
          python3 render_check.py --chrome "$CHROME" | tee "$RUNNER_TEMP/render.log"

      - name: Commit the refreshed data and static layer
        id: commit
        if: steps.diff.outputs.changed == 'true' || steps.static.outcome == 'success'
        # A push made with GITHUB_TOKEN does not itself start a workflow run, so
        # this commit cannot loop back into this workflow. Pages picks it up and
        # rebuilds the site from the branch.
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ snapshot/ sitemap.xml feed.xml index.html
          if git diff --cached --quiet; then
            echo 'Nothing staged; the rebuild was byte-identical.'
            echo 'pushed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh dashboard data ($(date -u '+%d %B %Y'))"
          # Runs queue rather than cancel, so a run held behind another one
          # checked the branch out before that one pushed and its own push is
          # then rejected. Rebase onto the tip and try again. The regenerated
          # files win any conflict, since this run built them from the newest
          # data: in a rebase `theirs` is the commit being replayed, which is
          # the commit made above.
          for attempt in 1 2 3; do
            if git push; then
              echo 'pushed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected; rebasing onto the branch tip (attempt $attempt)."
            git pull --rebase -X theirs origin main
          done
          echo 'Could not push after three attempts.' >&2
          exit 1

      # An independent timestamp of each published version. The record argues
      # from dated evidence, so the site itself should be datable by someone who
      # does not trust this repository. Best effort: the archive throttles and
      # times out, and a missed snapshot is not a reason to fail a data refresh.
      - name: Ask the Internet Archive to keep a copy
        if: steps.commit.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          base='https://palestinerecord.github.io'
          for path in '/' '/snapshot/overview.html' '/snapshot/index.html' '/sitemap.xml' '/feed.xml'; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 120 \
              "https://web.archive.org/save/${base}${path}" || echo 000)"
            echo "archive ${path}: ${code}"
            sleep 6
          done

      # IndexNow tells the search engines that carry it (Bing, Yandex, Seznam,
      # Naver) which pages changed, instead of waiting for a crawl that may be
      # weeks away. The key is the file of the same name at the site root; a
      # submission is only accepted while that file is served and matches.
      # Google does not participate, which is what the sitemap is for.
      - name: Tell IndexNow which pages changed
        if: steps.commit.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          python3 - <<'PY' > indexnow.json
          import json, re, pathlib
          key = next(p.stem for p in pathlib.Path('.').glob('*.txt')
                     if re.fullmatch(r'[0-9a-f]{8,128}', p.stem))
          urls = re.findall(r'<loc>([^<]+)</loc>', pathlib.Path('sitemap.xml').read_text())
          print(json.dumps({'host': 'palestinerecord.github.io',
                            'key': key,
                            'keyLocation': 'https://palestinerecord.github.io/%s.txt' % key,
                            'urlList': urls}))
          PY
          code="$(curl -s -o /dev/null -w '%{http_code}' -m 60 \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @indexnow.json 'https://api.indexnow.org/IndexNow' || echo 000)"
          rm -f indexnow.json
          echo "indexnow: ${code}"

      - name: Write the run summary
        if: always()
        run: |
          {
            echo '## Dashboard refresh'
            echo
            echo "Data changed: **${{ steps.diff.outputs.changed || 'unknown' }}**"
            echo
            for log in fetch validate prerender render; do
              if [ -f "$RUNNER_TEMP/$log.log" ]; then
                echo "### $log"
                echo '```'
                cat "$RUNNER_TEMP/$log.log"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
